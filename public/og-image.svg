<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Mundo News — A verdade em primeiro lugar">
  <!-- Fundo -->
  <rect width="1200" height="630" fill="#1a1a2e"/>
  <rect width="1200" height="6" fill="#c41e3a"/>
  <rect y="624" width="1200" height="6" fill="#c41e3a"/>
  <!-- Padrão decorativo -->
  <circle cx="1050" cy="120" r="200" fill="#c41e3a" opacity="0.08"/>
  <circle cx="150" cy="520" r="160" fill="#e8b923" opacity="0.06"/>
  <!-- Ícone central -->
  <g transform="translate(520, 175)">
    <circle cx="80" cy="80" r="70" fill="none" stroke="#e8b923" stroke-width="3"/>
    <ellipse cx="80" cy="80" rx="30" ry="70" fill="none" stroke="#e8b923" stroke-width="2"/>
    <line x1="10" y1="80" x2="150" y2="80" stroke="#e8b923" stroke-width="2"/>
    <rect x="115" y="45" width="50" height="65" rx="4" fill="#c41e3a"/>
    <line x1="125" y1="60" x2="155" y2="60" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <line x1="125" y1="75" x2="155" y2="75" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <line x1="125" y1="90" x2="145" y2="90" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Título -->
  <text x="600" y="400" text-anchor="middle" font-family="Georgia, 'Merriweather', serif" font-size="72" font-weight="900" fill="#ffffff">Mundo News</text>
  <text x="600" y="460" text-anchor="middle" font-family="Arial, 'Source Sans 3', sans-serif" font-size="28" font-weight="600" fill="#e8b923" letter-spacing="0.06em">A VERDADE EM PRIMEIRO LUGAR</text>
  <text x="600" y="520" text-anchor="middle" font-family="Arial, 'Source Sans 3', sans-serif" font-size="22" fill="#a0a0b8">Notícias do Brasil e do mundo em tempo real</text>
  <!-- Barra inferior -->
  <rect x="450" y="555" width="300" height="4" rx="2" fill="#c41e3a"/>
</svg>
