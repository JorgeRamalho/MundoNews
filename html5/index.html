<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fallback estático — substituído pelo PageMeta (react-helmet-async) após o JS carregar -->
    <title>Mundo News — A verdade em primeiro lugar</title>
    <meta name="description" content="Mundo News — Notícias do Brasil e do mundo em tempo real. Artigos, opinião e informação com compromisso com a verdade." />
    <meta name="author" content="Mundo News" />
    <meta name="theme-color" content="#c41e3a" />
    <meta name="color-scheme" content="light dark" />
    <link rel="alternate" type="application/rss+xml" title="Mundo News RSS" href="https://mundonwes.netlify.app/feed.xml" />
    <meta name="application-name" content="Mundo News" />
    <meta name="apple-mobile-web-app-title" content="Mundo News" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Ícones e manifesto -->
    <link rel="icon" type="image/svg+xml" href="../public/favicon.svg" />
    <link rel="icon" type="image/svg+xml" href="../public/logo-icon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="../public/apple-touch-icon.svg" />
    <link rel="manifest" href="../public/site.webmanifest" />
    <link rel="sitemap" type="application/xml" href="https://mundonwes.netlify.app/sitemap.xml" />

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Live Server: CSS/JS gerados por `npm run build`. O Vite (npm run dev) ignora estes e usa main.tsx. -->
    <link rel="stylesheet" crossorigin href="../dist/assets/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../dist/assets/index.js"></script>
  </body>
</html>
